<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kitappla</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#2b2118;--mu:#7a6a5a;--ac:#b5472b;--bd:#e6dccd}
@media(prefers-color-scheme:dark){:root{--bg:#1b1612;--card:#262019;--tx:#f1e8dc;--mu:#a99887;--ac:#e0704f;--bd:#3a3128}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Georgia,serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:30px;color:var(--ac)}
button{font:600 15px system-ui,sans-serif;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:13px 16px}
button.s,a.s{background:none;color:var(--ac);border:1px solid var(--ac);padding:7px 10px;font:13px system-ui,sans-serif;border-radius:10px;text-decoration:none;display:inline-block}
.row{display:flex;gap:8px;margin:14px 0}.row button{flex:1}
#st{font:14px system-ui,sans-serif;color:var(--mu);margin:6px 0 10px}
input{width:100%;font:15px system-ui,sans-serif;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:10px}
.book{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.cv{width:60px;height:88px;border-radius:4px;flex:none;color:#fff;font:10px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;object-fit:cover}
.t{font-weight:700;font-size:17px}.a,.p{color:var(--mu);font:14px system-ui,sans-serif}.l{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
#set{display:none;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px;font:14px system-ui,sans-serif}
</style></head><body><main>
<div class="top"><h1>📚 Kitappla</h1><button class="s" id="cfg">⚙️</button></div>
<div id="set">Gemini API anahtarı (yalnızca bu telefonda saklanır):
<input id="key" type="password" placeholder="AIza..."><button id="ksave">Kaydet</button></div>
<div class="row"><button id="gal">🖼️ Galeriden ekle</button><button id="cam">📷 Kamera</button></div>
<div id="st"></div>
<input id="q" placeholder="Listede ara…">
<div id="list"></div>
<input type="file" id="fb" accept="image/*" multiple hidden>
</main>
<script>
const $=id=>document.getElementById(id);
let books=JSON.parse(localStorage.getItem("kitappla")||"[]");
const save=()=>localStorage.setItem("kitappla",JSON.stringify(books));
const Cam=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Camera;
const esc=s=>{const d=document.createElement("div");d.textContent=s||"";return d.innerHTML};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const gi=q=>"https://www.google.com/search?tbm=isch&q="+encodeURIComponent(q);
function render(){
 const q=$("q").value.toLowerCase();
 $("list").innerHTML=books.filter(b=>(b.title+b.author+b.publisher).toLowerCase().includes(q)).map(b=>{
  const k=b.title+" "+b.author,h=hue(b.title);
  const front=b.front?`<img class="cv" src="${esc(b.front)}" alt="">`:`<div class="cv" style="background:hsl(${h},45%,38%)">${esc(b.title)}</div>`;
  return `<div class="book">${front}<div><div class="t">${esc(b.title)}</div>
  <div class="a">✍️ ${esc(b.author)||"—"}</div><div class="p">🏛️ ${esc(b.publisher)||"—"}${b.guess&&b.publisher?" (tahmini)":""}</div>
  <div class="l"><a class="s" target="_blank" href="${gi(k+" kitap kapağı")}">Ön kapak</a><a class="s" target="_blank" href="${gi(k+" arka kapak")}">Arka kapak</a></div></div></div>`}).join("");
}
function shrink(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.85).split(",")[1])};i.onerror=no;i.src=src})}
const toDataUrl=async u=>{const b=await (await fetch(u)).blob();return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})};
const PROMPT='Bu fotoğrafta kitap sırtları var. Okunabilen her kitabı bul. Yalnızca JSON dizisi döndür: [{"title":"","author":"","publisher":"","guess":false}]. Sırtta yazanı aynen kullan. Yayınevi sırtta yoksa ve kitabı kesin tanıyorsan Türkiye baskısının yayınevini yaz, guess:true yap; emin değilsen boş bırak.';
const MODELS=["gemini-3.5-flash","gemini-2.5-flash"];
async function read(b64){
 const key=localStorage.getItem("kitappla_key");if(!key)throw new Error("Önce ⚙️ ile API anahtarını gir.");
 let last="";
 for(const m of MODELS){
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"content-type":"application/json"},
  body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:"image/jpeg",data:b64}},{text:PROMPT}]}],generationConfig:{responseMimeType:"application/json"}})});
  const j=await r.json();
  if(r.status===404){last=(j.error&&j.error.message)||"model yok";continue}
  if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
  const t=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||"").join("");
  return JSON.parse(t.replace(/```json|```/g,"").trim());
 }
 throw new Error(last);
}
async function cover(b){
 try{const q=encodeURIComponent("intitle:"+b.title+(b.author?" inauthor:"+b.author:""));
  const j=await (await fetch("https://www.googleapis.com/books/v1/volumes?maxResults=1&q="+q)).json();
  const v=j.items&&j.items[0]&&j.items[0].volumeInfo;
  if(v){const im=v.imageLinks;if(im)b.front=(im.thumbnail||im.smallThumbnail).replace("http://","https://");
   if(!b.publisher&&v.publisher){b.publisher=v.publisher;b.guess=true}}}catch(e){}
 if(!b.front){try{const j=await (await fetch("https://openlibrary.org/search.json?limit=1&fields=cover_i&title="+encodeURIComponent(b.title)+"&author="+encodeURIComponent(b.author||""))).json();
  const c=j.docs&&j.docs[0]&&j.docs[0].cover_i;if(c)b.front="https://covers.openlibrary.org/b/id/"+c+"-M.jpg"}catch(e){}}
}
async function process(urls){
 let n=0;
 for(const [i,u] of urls.entries()){
  $("st").textContent=`Fotoğraf ${i+1}/${urls.length} okunuyor…`;
  try{
   const list=await read(await shrink(u));
   for(const x of list){
    if(!x.title||books.some(y=>y.title.toLowerCase()===x.title.toLowerCase()))continue;
    const b={title:x.title,author:x.author||"",publisher:x.publisher||"",guess:!!x.guess};
    books.push(b);n++;save();render();
    cover(b).then(()=>{save();render()});
   }
  }catch(e){$("st").textContent="Hata: "+e.message;return}
 }
 $("st").textContent=`${n} yeni kitap eklendi. Toplam: ${books.length}`;
}
$("gal").onclick=async()=>{
 const C=Cam();if(!C)return $("fb").click();
 try{const r=await C.pickImages({quality:85,limit:10});
  process(await Promise.all(r.photos.map(p=>toDataUrl(p.webPath))))}catch(e){}
};
$("cam").onclick=async()=>{
 const C=Cam();if(!C)return $("fb").click();
 try{const p=await C.getPhoto({source:"CAMERA",resultType:"dataUrl",quality:85});process([p.dataUrl])}catch(e){}
};
$("fb").onchange=async e=>{process(await Promise.all([...e.target.files].map(f=>toDataUrl(URL.createObjectURL(f)))))};
$("cfg").onclick=()=>{const s=$("set");s.style.display=s.style.display==="block"?"none":"block";$("key").value=localStorage.getItem("kitappla_key")||""};
$("ksave").onclick=()=>{localStorage.setItem("kitappla_key",$("key").value.trim());$("set").style.display="none";$("st").textContent="Anahtar kaydedildi."};
$("q").oninput=render;
if(!localStorage.getItem("kitappla_key"))$("st").textContent="Başlamak için sağ üstteki ⚙️ ile Gemini API anahtarını gir.";
render();
</script></body></html>
