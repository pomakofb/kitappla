<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kitappla</title>
<style>
:root{--bg:#f5f3ef;--sf:#fff;--tx:#1c1917;--mu:#78716c;--ac:#d9531e;--ac2:#ff8a4c;--bd:#ebe7e1;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(40,30,20,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0f0e0d;--sf:#1b1917;--tx:#f5f1ec;--mu:#a8a29e;--ac:#ff7a45;--ac2:#ff9f6e;--bd:#2c2825;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em}h1 span{color:var(--ac)}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);color:var(--tx);display:grid;place-items:center;padding:0;box-shadow:var(--sh)}
main{max-width:640px;margin:0 auto;padding:4px 16px 28px}
button{font:inherit;cursor:pointer;border:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:16px;border-radius:20px;color:#fff;font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 22px rgba(217,83,30,.28)}
.tile .ic{width:28px;height:28px}.tile small{display:block;font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.tile:active{transform:scale(.98)}
.tile span{text-align:left}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:10px 14px;border-radius:999px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);font-size:14px;font-weight:600;box-shadow:var(--sh)}
.chip .ic{color:var(--ac)}
.pk{position:relative;overflow:hidden;margin-top:12px;padding:14px;border-radius:14px;background:var(--sf);border:1.5px dashed var(--ac);color:var(--ac);text-align:center;font-weight:600}
.pk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0}
#st{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--sf);border:1px solid var(--bd);color:var(--mu);font-size:13.5px}#st:empty{display:none}
#set{display:none;margin-top:12px;padding:14px;border-radius:16px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);font-size:14px}
#set b{display:block;margin-bottom:8px}
.f{width:100%;font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);outline:none}.f:focus{border-color:var(--ac)}
#ksave{margin-top:10px;padding:11px 18px;border-radius:12px;background:var(--ac);color:#fff;font-weight:700}
.search{position:relative;margin:18px 0 6px}.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu)}
.search .f{padding-left:42px;border-radius:999px;background:var(--sf)}
#cnt{margin:6px 4px 10px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}#cnt:empty{display:none}
.book{display:flex;gap:14px;padding:14px;margin-bottom:12px;border-radius:20px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh)}
.cvs{display:flex;flex-direction:column;gap:8px;flex:none}
.cv{width:76px;height:112px;border-radius:8px;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.cv.ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:#fff;font-size:11px;font-weight:700;line-height:1.25;border-left:4px solid rgba(255,255,255,.25)}
.cv.sm{width:48px;height:70px;border-radius:6px;align-self:center}
.bd{min-width:0;flex:1}
.t{font-weight:700;font-size:16.5px;line-height:1.25;letter-spacing:-.01em}.a{color:var(--mu);font-size:14px;margin-top:2px}
.tag{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);font-size:12px;font-weight:600}
.d{margin:10px 0 0;font-size:13.5px;color:var(--tx);opacity:.88;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.d.open{-webkit-line-clamp:unset;display:block}
.src{margin-top:3px;font-size:11.5px;color:var(--mu)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mini{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:10px;background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--ac);font-size:12.5px;font-weight:600;text-decoration:none}
.mini .ic{width:14px;height:14px}.mini.ghost{background:transparent;border:1px solid var(--bd);color:var(--mu)}
.rev{margin-top:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--ac) 7%,transparent)}.rh{font-size:12px;font-weight:700;color:var(--ac);margin-bottom:4px}.rt{font-size:13px;white-space:pre-line}.rev a{font-size:12px;color:var(--ac);font-weight:600;display:inline-block;margin-top:6px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:56px 24px;color:var(--mu)}.empty b{color:var(--tx);font-size:17px}.eb{font-size:46px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
<symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
<symbol id="i-q" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
<symbol id="i-re" viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
</defs></svg>
<div class="bar"><h1>kitap<span>pla</span></h1><button class="icon" id="cfg" aria-label="Ayarlar"><svg class="ic"><use href="#i-set"/></svg></button></div>
<main>
<div id="set"><b>Gemini API anahtarı</b><input class="f" id="key" type="password" placeholder="AIza..."><button id="ksave">Kaydet</button><div style="margin-top:8px;color:var(--mu);font-size:12.5px">Yalnızca bu telefonda saklanır.</div></div>
<div class="tiles">
<button class="tile" id="gal"><svg class="ic"><use href="#i-img"/></svg><span>Galeriden ekle<small>Sırt fotoğrafı seç</small></span></button>
<button class="tile" id="cam"><svg class="ic"><use href="#i-cam"/></svg><span>Kamera<small>Fotoğraf çek</small></span></button>
</div>
<div class="pk" id="alt" style="display:none">Kamera (alternatif)<input type="file" id="fc" accept="image/*" capture="environment"></div>
<div class="chips">
<button class="chip" id="xl"><svg class="ic"><use href="#i-dl"/></svg>Excel</button>
<button class="chip" id="pdf"><svg class="ic"><use href="#i-dl"/></svg>PDF</button>
<button class="chip" id="fill"><svg class="ic"><use href="#i-re"/></svg>Bilgileri tamamla</button>
</div>
<div class="pk" id="alt2" style="display:none">Kapak fotoğrafı seç / çek (alternatif)<input type="file" id="fc2" accept="image/*"></div>
<div id="st"></div>
<div class="search"><svg class="ic"><use href="#i-q"/></svg><input class="f" id="q" placeholder="Kitap, yazar veya yayınevi ara"></div>
<div id="cnt"></div>
<div id="list"></div>
<div style="text-align:center;color:var(--mu);font-size:11px;margin-top:20px">Sürüm 5</div>
<input type="file" id="fb" accept="image/*" multiple hidden>
</main>
<script>

const $=id=>document.getElementById(id);
window.onerror=(m,u,l)=>{const s=$("st");if(s)s.textContent="Hata: "+m+(l?" (satır "+l+")":"")};
$("cfg").onclick=()=>{const s=$("set");s.style.display=s.style.display==="block"?"none":"block";$("key").value=localStorage.getItem("kitappla_key")||""};
$("ksave").onclick=()=>{localStorage.setItem("kitappla_key",$("key").value.trim());$("set").style.display="none";$("st").textContent="Anahtar kaydedildi."};
if(!localStorage.getItem("kitappla_key"))$("set").style.display="block";
let books=[];try{books=JSON.parse(localStorage.getItem("kitappla")||"[]")}catch(e){}
books.forEach(b=>{if(!b.id)b.id="b"+Math.random().toString(36).slice(2,9)});
const save=()=>{try{localStorage.setItem("kitappla",JSON.stringify(books))}catch(e){$("st").textContent="Kayıt alanı doldu, son değişiklik kaydedilemedi."}};
const P=n=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins[n];
const esc=s=>{const d=document.createElement("div");d.textContent=s||"";return d.innerHTML};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const gi=q=>"https://www.google.com/search?tbm=isch&q="+encodeURIComponent(q);
function render(){
 const q=$("q").value.toLowerCase();
 const list=books.filter(b=>(b.title+b.author+b.publisher).toLowerCase().includes(q));
 $("cnt").textContent=books.length?list.length+" kitap":"";
 if(!books.length){$("list").innerHTML='<div class="empty"><div class="eb">📚</div><b>Kitaplığın henüz boş</b><span>Kitap sırtlarının fotoğrafını ekleyerek başla.</span></div>';return}
 $("list").innerHTML=list.map(b=>{
  const k=b.title+" "+b.author,h=hue(b.title),fr=b.fimg||b.front;
  const front=fr?`<img class="cv" src="${esc(fr)}" alt="">`:`<div class="cv ph" style="background:linear-gradient(145deg,hsl(${h},50%,46%),hsl(${(h+40)%360},55%,28%))">${esc(b.title)}</div>`;
  const back=b.bimg?`<img class="cv sm" src="${esc(b.bimg)}" alt="">`:"";
  const tag=b.publisher?`<span class="tag">${esc(b.publisher)}${b.guess?" · tahmini":""}</span>`:"";
  const d=b.desc?`<p class="d">${esc(b.desc)}</p><div class="src">${esc(b.descSrc)}</div>`:"";
  const rev=b.rev?`<div class="rev"><div class="rh">1000Kitap okur yorumları</div><div class="rt">${esc(b.rev.t)}</div><a target="_blank" href="${esc(b.rev.url)}">Sayfayı aç</a></div>`:"";
  return `<article class="book"><div class="cvs">${front}${back}</div><div class="bd">
  <div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)||"Yazar bilinmiyor"}</div>${tag}${d}${rev}
  <div class="acts"><button class="mini" data-id="${b.id}" data-side="f"><svg class="ic"><use href="#i-cam"/></svg>Ön kapak</button><button class="mini" data-id="${b.id}" data-side="b"><svg class="ic"><use href="#i-cam"/></svg>Arka kapak</button>
  <a class="mini ghost" target="_blank" href="${gi(k+" kitap kapağı")}">Kapak ara</a><button class="mini ghost" data-rev="${b.id}">${b.rev?"Yorumları yenile":"1000Kitap yorumları"}</button></div></div></article>`}).join("");
}
function shrink(src,max=1600,q=.85){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q).split(",")[1])};i.onerror=no;i.src=src})}
const toDataUrl=async u=>{const b=await (await fetch(u)).blob();return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})};
const PROMPT='Bu fotoğrafta kitap sırtları var. Okunabilen her kitabı bul. Yalnızca JSON dizisi döndür: [{"title":"","author":"","publisher":"","guess":false}]. Sırtta yazanı aynen kullan. Yayınevi sırtta yoksa ve kitabı kesin tanıyorsan Türkiye baskısının yayınevini yaz, guess:true yap; emin değilsen boş bırak.';
const GM=["gemini-3.5-flash","gemini-2.5-flash"];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tr2=t=>String(t||"").replace(/[İIı]/g,"i").toLowerCase().replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u").replace(/[^a-z0-9]+/g," ").trim();
async function gem(parts,json){
 const key=localStorage.getItem("kitappla_key");if(!key)throw new Error("Önce sağ üstteki ayarlardan API anahtarını gir.");
 let last="",code=0;
 for(const m of GM){
  const body={contents:[{parts}]};if(json)body.generationConfig={responseMimeType:"application/json"};
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if([404,429,503].includes(r.status)){last=(j.error&&j.error.message)||("HTTP "+r.status);code=r.status;continue}
  if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
  return ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
 }
 const e=new Error(code===429?"Gemini istek sınırı doldu, biraz bekleyip tekrar dene.":last);e.code=code;throw e;
}
async function gemRetry(parts,json){
 for(let i=0;;i++){try{return await gem(parts,json)}catch(e){if(i>=2||(e.code!==429&&e.code!==503))throw e;await sleep(8000*(i+1))}}
}
const read=async b64=>JSON.parse((await gemRetry([{inline_data:{mime_type:"image/jpeg",data:b64}},{text:PROMPT}],true)).replace(/```json|```/g,"").trim());
function score(v,b){
 const vt=tr2(v.title),va=tr2((v.authors||[]).join(" "));let h=0,s=0;
 tr2(b.title).split(" ").forEach(w=>{if(w.length>2&&vt.includes(w))h++});
 if(b.author)tr2(b.author).split(" ").forEach(w=>{if(w.length>2&&va.includes(w))s++});
 return h?h*3+s*2+(v.description?1:0)+(v.imageLinks?1:0):0;
}
async function gbooks(b){
 const qs=["intitle:"+b.title+(b.author?" inauthor:"+b.author:""),b.title+" "+(b.author||"")];
 for(const q of qs){
  for(let t=0;t<2;t++){
   const r=await fetch("https://www.googleapis.com/books/v1/volumes?maxResults=8&q="+encodeURIComponent(q));
   if(r.status===429){await sleep(1500);continue}
   if(!r.ok)throw new Error("Google Books "+r.status);
   const items=((await r.json()).items||[]).map(i=>i.volumeInfo).filter(Boolean).sort((x,y)=>score(y,b)-score(x,b));
   if(items.length&&score(items[0],b)>=3)return items[0];
   break;
  }
 }
 return null;
}
async function enrich(b){
 b.err="";
 if(!b.front||!b.desc||!b.publisher){
  try{const v=await gbooks(b);
   if(v){const im=v.imageLinks;if(im&&!b.front)b.front=(im.thumbnail||im.smallThumbnail).replace("http://","https://");
    if(!b.publisher&&v.publisher){b.publisher=v.publisher;b.guess=true}
    if(!b.desc&&v.description){b.desc=v.description.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,380);b.descSrc="Google Books"}}}
  catch(e){b.err="Google Books: "+e.message}
 }
 if(!b.front){try{const j=await (await fetch("https://openlibrary.org/search.json?limit=1&fields=cover_i&title="+encodeURIComponent(b.title)+"&author="+encodeURIComponent(b.author||""))).json();
  const c=j.docs&&j.docs[0]&&j.docs[0].cover_i;if(c)b.front="https://covers.openlibrary.org/b/id/"+c+"-M.jpg"}catch(e){}}
 if(!b.desc){try{const t=await gemRetry([{text:'"'+b.title+'" ('+(b.author||"yazar bilinmiyor")+') kitabı için Türkçe, en fazla 2 cümlelik, tarafsız kısa bir içerik özeti yaz. Kitabı tanımıyorsan ayrıntı uydurma, sadece "Bu kitap hakkında bilgi bulunamadı." yaz. Sadece özeti yaz.'}],false);
  if(t.trim()&&!/bilgi bulunamadı/i.test(t)){b.desc=t.trim().slice(0,380);b.descSrc="yapay zekâ özeti"}else b.err+=" Kitap tanınmadı."}catch(e){b.err+=" Gemini: "+e.message}}
 return !!b.desc;
}
let chain=Promise.resolve();
const enq=b=>{chain=chain.then(async()=>{await enrich(b);save();render();await sleep(1200)}).catch(()=>{});return chain};
const http=async url=>{
 const H=P("CapacitorHttp"),hd={"User-Agent":"Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36","Accept-Language":"tr-TR,tr;q=0.9"};
 if(H){const r=await H.get({url,headers:hd,responseType:"text"});if(r.status>=400)throw new Error("HTTP "+r.status);return typeof r.data==="string"?r.data:JSON.stringify(r.data)}
 const r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status);return r.text();
};
async function findKUrl(b){
 const q="site:1000kitap.com/kitap "+b.title+" "+(b.author||"");let err="";
 for(const e of ["https://html.duckduckgo.com/html/?q=","https://www.bing.com/search?q="]){
  try{const h=(await http(e+encodeURIComponent(q))).replace(/%3A/gi,":").replace(/%2F/gi,"/");
   const m=[...h.matchAll(/1000kitap\.com\/kitap\/([A-Za-z0-9\-_%.]+?--\d+)/g)].map(x=>x[1]);
   if(m.length){const t=tr2(b.title).split(" ")[0];return "https://1000kitap.com/kitap/"+(m.find(x=>tr2(x.replace(/--\d+$/,"")).startsWith(t))||m[0])}
   err="sonuç yok"}catch(x){err=e.split("/")[2]+": "+x.message}
 }
 throw new Error("Kitap sayfası bulunamadı ("+err+")");
}
async function loadReviews(b){
 $("st").textContent="1000Kitap sayfası aranıyor…";
 const url=b.kUrl||await findKUrl(b);b.kUrl=url;
 $("st").textContent="Yorumlar okunuyor…";
 let h=(await http(url)).replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi," ").replace(/<[^>]+>/g,"\n").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&#39;|&apos;/g,"'").replace(/&quot;/g,'"').replace(/[ \t]+/g," ").replace(/\n\s*\n+/g,"\n");
 const i=Math.max(0,h.indexOf("Yorumlar ve İncelemeler")),txt=h.slice(i,i+7000);
 if(txt.length<200)throw new Error("Sayfada yorum metni bulunamadı");
 $("st").textContent="Yorumlar özetleniyor…";
 const t=await gemRetry([{text:'Aşağıda 1000Kitap sitesinden "'+b.title+'" kitabı için okur yorumlarını içeren ham sayfa metni var. Okurların genel izlenimini Türkiye Türkçesiyle en fazla 3 kısa madde halinde özetle (beğenilenler, eleştirilenler, kimlere önerildiği). Yorumlardan cümle alıntılama, kullanıcı adı yazma. Okur yorumu yoksa sadece "Yorum bulunamadı." yaz. Her maddeyi "• " ile başlat.\n\n'+txt}],false);
 b.rev={t:t.trim().slice(0,700),url};
}
async function getRev(b){try{await loadReviews(b);save();render();$("st").textContent="Yorumlar eklendi."}catch(e){$("st").textContent="Yorumlar alınamadı: "+((e&&e.message)||e)}}
async function process(urls){
 let n=0;
 for(const [i,u] of urls.entries()){
  $("st").textContent=`Fotoğraf ${i+1}/${urls.length} okunuyor…`;
  try{
   const list=await read(await shrink(u));
   for(const x of list){
    if(!x.title||books.some(y=>y.title.toLowerCase()===x.title.toLowerCase()))continue;
    const b={id:"b"+Math.random().toString(36).slice(2,9),title:x.title,author:x.author||"",publisher:x.publisher||"",guess:!!x.guess};
    books.push(b);n++;save();render();
    enq(b);
   }
  }catch(e){$("st").textContent="Hata: "+e.message;return}
 }
 $("st").textContent=`${n} yeni kitap eklendi. Toplam: ${books.length}`;
}
$("gal").onclick=async()=>{
 const C=P("Camera");if(!C)return $("fb").click();
 try{const r=await C.pickImages({quality:85,limit:10});
  process(await Promise.all(r.photos.map(p=>toDataUrl(p.webPath))))}catch(e){}
};
$("cam").onclick=async()=>{
 const C=P("Camera");
 if(C){
  try{
   try{await C.requestPermissions({permissions:["camera"]})}catch(e){}
